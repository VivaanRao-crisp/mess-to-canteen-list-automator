name: Build & Release Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v0.1.0-beta.1)'
        required: false
        default: 'v0.1.0-beta.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows EXE & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Run automated test suite on Windows runner
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          pytest -v
          python run_acceptance_test.py

      - name: Build standalone Windows executable with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --clean -y HostelRegisterGenerator.spec

      - name: Verify executable build output
        shell: pwsh
        run: |
          $exePath = "dist/HostelRegisterGenerator.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "CRITICAL: HostelRegisterGenerator.exe was not generated!"
            exit 1
          }
          $fileSize = (Get-Item $exePath).Length
          if ($fileSize -lt 1000000) {
            Write-Error "CRITICAL: Generated executable is abnormally small ($fileSize bytes)!"
            exit 1
          }
          Write-Host "SUCCESS: HostelRegisterGenerator.exe generated ($([math]::Round($fileSize/1MB, 2)) MB)."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HostelRegisterGenerator-Windows-EXE
          path: dist/HostelRegisterGenerator.exe
          if-no-files-found: error

      - name: Determine release tag
        id: release_info
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="${{ github.event.inputs.version_tag || 'v0.1.0-beta.1' }}"
          fi
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with HostelRegisterGenerator.exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: "Hostel Register Generator — ${{ steps.release_info.outputs.tag }}"
          files: dist/HostelRegisterGenerator.exe
          prerelease: true
          draft: false
          body: |
            # Hostel Register Generator — Beta

            Download **`HostelRegisterGenerator.exe`** under **Assets** below.

            ### 🚀 Quick Start
            1. Download `HostelRegisterGenerator.exe`.
            2. Double-click it to open the application.
            3. Click **"Choose Excel File (.xlsx)..."** and select your monthly hostel Excel file.
            4. Review the auto-detected columns and student list preview.
            5. Click **"Generate Canteen Register"** and choose where to save the formatted file.

            ---
            ### ✨ Features
            - **No Setup Needed**: Completely standalone. Does not require Python, terminal commands, or an installer.
            - **Print-Ready Layout**: Formats every student into exactly 2 rows with vertically merged Roll, Name, and Room cells.
            - **2 Separate Handwriting Cells**: The Money / Record column provides two unmerged cells per student for cash/record tracking.
            - **100% Offline & Private**: Runs entirely on your local Windows PC without sending data to any cloud service.
            - **Zero Risk**: Your original monthly Excel file is never modified.
